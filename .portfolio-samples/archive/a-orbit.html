<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nitesh — Sample A · Orbit</title>
<style>
  :root{
    --bg:#ece9e2; --ink:#1c1a17; --muted:#6f6a61; --line:#cdc8bd; --accent:#a4512f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  canvas{position:fixed; inset:0; width:100%; height:100%; display:block}
  .stage{position:relative; z-index:2; text-align:center; padding:2rem}
  h1{font-size:clamp(2.6rem,7vw,4.4rem); font-weight:400; letter-spacing:.01em}
  .words{margin-top:.6rem; color:var(--muted); font-size:clamp(.85rem,2vw,1rem); letter-spacing:.18em; text-transform:lowercase; font-family:ui-monospace,Menlo,monospace}
  .words span{margin:0 .5rem}
  nav{margin-top:2.2rem; display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap}
  nav a{
    font-family:ui-monospace,Menlo,monospace; font-size:.78rem; letter-spacing:.05em;
    color:var(--ink); text-decoration:none; padding:.42rem .85rem;
    border:1px solid var(--line); border-radius:2px; background:rgba(255,255,255,.25);
    transition:all .15s ease;
  }
  nav a:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px)}
  .hint{position:fixed; left:1.4rem; bottom:1.3rem; z-index:2; font-family:ui-monospace,Menlo,monospace; font-size:.68rem; color:var(--muted); letter-spacing:.15em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stage">
  <h1>Nitesh Balla</h1>
  <div class="words"><span>engineer</span>·<span>builder</span>·<span>explorer</span></div>
  <nav>
    <a href="#">Blog</a><a href="#">GitHub</a><a href="#">LinkedIn</a><a href="#">Writing</a><a href="#">X</a>
  </nav>
</div>
<div class="hint">[ b g l w x ] · type to navigate</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,dpr;function size(){dpr=devicePixelRatio||1;W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
size();addEventListener('resize',size);
const cx=()=>W*0.5, cy=()=>H*0.62, R=()=>Math.min(W,H)*0.78;
let t=0;
function draw(){
  x.clearRect(0,0,W,H);
  // planet arc (filled subtle gradient)
  const g=x.createLinearGradient(0,cy()-R(),0,cy()+R());
  g.addColorStop(0,'rgba(180,175,165,.0)');g.addColorStop(1,'rgba(150,144,132,.35)');
  x.beginPath();x.arc(cx(),cy(),R(),Math.PI,0);x.closePath();x.fillStyle=g;x.fill();
  // rim
  x.beginPath();x.arc(cx(),cy(),R(),Math.PI,0);x.strokeStyle='rgba(120,114,102,.35)';x.lineWidth=1*dpr;x.stroke();
  // radiating orbital lines from a point
  const px=cx(), py=cy()-R()*0.05;
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2 + t*0.04;
    const len=R()*(0.7+0.3*Math.sin(i*1.3+t*0.3));
    x.beginPath();x.moveTo(px,py);
    x.lineTo(px+Math.cos(a)*len, py+Math.sin(a)*len*0.55);
    x.strokeStyle='rgba(110,104,92,'+(0.06+0.05*Math.sin(i+t*0.5))+')';x.lineWidth=1*dpr;x.stroke();
  }
  // orbiting particles
  for(let i=0;i<5;i++){
    const a=t*(0.2+i*0.05)+i;const rr=R()*(0.45+i*0.12);
    const ox=px+Math.cos(a)*rr, oy=py+Math.sin(a)*rr*0.55;
    x.beginPath();x.arc(ox,oy,2*dpr,0,7);x.fillStyle='rgba(60,56,48,.5)';x.fill();
  }
  // center node
  x.beginPath();x.arc(px,py,4*dpr,0,7);x.fillStyle='#2a2722';x.fill();
  t+=0.01;requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
