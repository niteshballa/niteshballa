<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nitesh — Sample C · Aurora</title>
<style>
  :root{ --bg:#0a0a0f; --ink:#f4f3f8; --muted:#9b97a8; --line:rgba(255,255,255,.12); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  canvas{position:fixed; inset:0; width:100%; height:100%; display:block; filter:blur(60px) saturate(1.4)}
  .grain{position:fixed; inset:0; z-index:1; opacity:.5; background:
    radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%)}
  .stage{position:relative; z-index:2; text-align:center; padding:2rem}
  .eyebrow{font-size:.72rem; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); margin-bottom:1.3rem}
  h1{font-size:clamp(2.8rem,8vw,5rem); font-weight:600; letter-spacing:-.03em; line-height:1}
  .sub{margin-top:1.1rem; color:var(--muted); font-size:clamp(.95rem,2.2vw,1.15rem); max-width:30ch; margin-inline:auto; line-height:1.5}
  nav{margin-top:2.6rem; display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap}
  nav a{
    text-decoration:none; color:var(--ink); font-size:.85rem; font-weight:500;
    padding:.6rem 1.15rem; border:1px solid var(--line); border-radius:999px;
    backdrop-filter:blur(8px); background:rgba(255,255,255,.04); transition:all .18s ease;
  }
  nav a:hover{background:rgba(255,255,255,.12); transform:translateY(-2px)}
  nav a.primary{background:var(--ink); color:#0a0a0f; border-color:var(--ink)}
  nav a.primary:hover{opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="grain"></div>
<div class="stage">
  <div class="eyebrow">Engineer · Writer</div>
  <h1>Nitesh Balla</h1>
  <p class="sub">I build resilient backend systems and write about the hard parts of running software in production.</p>
  <nav>
    <a class="primary" href="#">Read the blog</a>
    <a href="#">GitHub</a>
    <a href="#">LinkedIn</a>
    <a href="#">Résumé</a>
  </nav>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,dpr;function size(){dpr=devicePixelRatio||1;W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
size();addEventListener('resize',size);
const blobs=[
  {h:268,r:.5},{h:200,r:.42},{h:330,r:.46},{h:160,r:.4}
];
let t=0;
function draw(){
  x.clearRect(0,0,W,H);
  blobs.forEach((b,i)=>{
    const bx=W*(0.5+0.32*Math.sin(t*0.3+i*1.7));
    const by=H*(0.5+0.32*Math.cos(t*0.26+i*2.1));
    const rad=Math.min(W,H)*b.r;
    const g=x.createRadialGradient(bx,by,0,bx,by,rad);
    g.addColorStop(0,'hsla('+b.h+',75%,58%,.55)');
    g.addColorStop(1,'hsla('+b.h+',75%,58%,0)');
    x.fillStyle=g;x.beginPath();x.arc(bx,by,rad,0,7);x.fill();
  });
  t+=0.006;requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
